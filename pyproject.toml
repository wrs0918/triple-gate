[project]
name = "triple-gate"
version = "0.1.0"
description = "三重门 —— 会拒绝的网文流水线：量化指标 + 模式 lint + 叙事架构 rubric 三层质量门禁"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# 可选：提升 TTR 分词精度与词性判断。未安装时相关指标自动降级为参考级
jieba = ["jieba>=0.42.1"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["scripts"]
omit = ["scripts/tg.py"]

[tool.coverage.report]
fail_under = 80
